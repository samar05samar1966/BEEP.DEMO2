<!DOCTYPE html>

<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NFC Scan | BEEP</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<a href="index.html" class="logo">
    <img src="images/BEEPlogo.png" alt="BART Logo">
   </a>
<h1>
Blue Envelope Program
</h1>


</header>




<section class="scan-animation">


<h2 id="scanText">
Scanning Blue Envelope...
</h2>


<div class="loader"></div>


<button onclick="completeScan()">
Simulate Scan
</button>


</section>



<section id="profile" class="profile hidden">
    <h2>✓ NFC Scan Successful</h2>
    <p>This rider has chosen to share accessibility information.</p>
    <hr>

    <h2>👤 Rider Profile</h2>
    <p><strong>Name:</strong> <span id="displayName"></span> (<span id="displayPronouns"></span>)</p>
    <p><strong>Age:</strong> <span id="displayAge"></span></p>
    <p><strong>Address:</strong> <span id="displayAddress"></span></p>
    <p><strong>Emergency Contact:</strong> <span id="displayEmergency"></span></p>

    <h2>🚉 Destination</h2>
    <p><strong id="displayStation"></strong></p>

    <h2>Support & Accommodations</h2>
    
    <div class="support">
        <h3>💬 Communication Preference</h3>
        <p id="displayComm"></p>
    </div>

    <div class="support">
        <h3>♿ Requested Accommodation</h3>
        <p id="displayAccommodation"></p>
    </div>

    <a href="index.html">
        <button>Reset Demo / Return Home</button>
    </a>
</section>






<script src="script.js"></script>


</body>

</html>
